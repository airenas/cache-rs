[package]
name = "cache-rs"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
tokio = { version = "1.53", features = ["full", "tracing"] }
anyhow = "1.0"
clap = { version = "4.6", features = ["derive", "env"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing = "0.1"
tokio-util = "0.7"
tower-http = { version = "0.7", features = ["limit", "timeout", "trace"] }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
futures = "0.3"
http = "1.5"
moka = { version = "0.12", features = ["future"] }
axum = { version = "0.8", features = ["macros", "http2"] }
axum-server = { version = "0.8", features = ["tls-rustls"] }
prometheus = "0.14"
humantime = "2.4"
mimalloc = "0.1.52"


[[bin]]
name = "cache-rs"
path = "src/main.rs"

[profile.release]
opt-level = 3
codegen-units = 1
lto = "thin"
debug = false
